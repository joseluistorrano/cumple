<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Cumpleaños 🎉</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            display: none;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 15px 25px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            z-index: 99;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Cargando AR...</h2>
        <p>Asegúrate de permitir acceso a la cámara</p>
    </div>
    
    <div id="info">
        📍 Apunta la cámara a cualquier superficie
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: light; matrixCodeType: 3x3;"
    >
        <!-- Imagen de cumpleaños -->
        <a-image
            src="cumple.png"
            position="0 0 -3"
            scale="2 2 1"
            rotation="0 0 0"
            id="cumpleImage"
        ></a-image>

        <!-- Audio que se reproduce automáticamente -->
        <a-entity
            id="audioEntity"
            sound="src: url(cancion.mp3); autoplay: true; loop: true; volume: 1;"
        ></a-entity>

        <!-- Cámara -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Mostrar mensaje cuando esté listo
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loading').style.display = 'block';
        });

        // Ocultar loading cuando la escena esté lista
        document.querySelector('a-scene').addEventListener('loaded', function() {
            document.getElementById('loading').style.display = 'none';
        });

        // Mejorar animación de entrada de la imagen
        const img = document.getElementById('cumpleImage');
        img.setAttribute('animation', 'property: scale; from: 0 0 1; to: 2 2 1; duration: 1000; easing: easeOutElastic');
    </script>
</body>
</html>
